<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aplicația Green Future Sinaia</title>
<meta name="description" content="De unde a pornit ideea, cum arată aplicația pentru client și proprietar și cum o vom promova.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C110D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Culorile și fonturile aplicației reale. Stânga: povestea pasului. Dreapta: telefonul, unde pulsează butonul de apăsat. */
:root{
  --ground:#0C110D;--surface:#141B15;--surface2:#1D261E;--ink:#F1EDE3;--soft:#C4C2B5;--line:#2F392F;
  --accent:#C8A45D;--accent2:#E2C88F;--on:#17120A;--ok:#8AD3A6;--warn:#E8BF72;
  --titlu:"Cormorant Garamond",Georgia,serif;--corp:"Figtree","Segoe UI",system-ui,sans-serif;color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#070A08;color:var(--ink);font-family:var(--corp);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
h1,h2,h3{font-family:var(--titlu);font-weight:500;text-wrap:balance}
.pagina{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.meniu{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 9px) max(14px,env(safe-area-inset-right)) 9px max(14px,env(safe-area-inset-left));overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:var(--ground)}
.meniu::-webkit-scrollbar{display:none}
.meniu .gr{flex:none;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);margin:0 2px 0 9px}
.meniu button{flex:none;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;font-weight:500;white-space:nowrap}
.meniu button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
#scena{min-height:0;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right)) 18px max(16px,env(safe-area-inset-left))}
.slide{max-width:1120px;margin:0 auto;min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:center}
.poveste{display:grid;gap:11px;min-width:0}
.eticheta{font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.poveste h2{font-size:clamp(31px,4.4vw,54px);line-height:1.02}
.poveste p{font-size:clamp(15.5px,1.55vw,19px);line-height:1.45;color:#DEDCD0;max-width:48ch}
.spate{display:grid;gap:3px;border-left:3px solid var(--accent);padding:3px 0 3px 12px;font-size:clamp(14px,1.3vw,16px);line-height:1.4;max-width:50ch}
.spate b{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent2)}
.obs{font-size:13.5px;line-height:1.4;color:var(--warn);max-width:50ch}
.pasi{display:flex;gap:5px;max-width:330px}
.pasi i{flex:1;height:4px;border-radius:9px;background:var(--surface2)}
.pasi i.g{background:var(--accent)}
/* Telefon */
.tel{justify-self:center;width:min(100%,336px);height:610px;border-radius:34px;border:8px solid #252C26;background:var(--ground);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 26px 70px rgba(0,0,0,.6)}
.apare{animation:apare .22s ease-out both}
@keyframes apare{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.bara{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px 8px;border-bottom:1px solid var(--line);font-family:var(--titlu);font-size:17px;font-weight:600}
.bara small{font-family:var(--corp);font-size:11.5px;font-weight:500;color:var(--soft)}
.corp{flex:1;min-height:0;overflow:hidden;padding:12px 13px;display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:1.35}
.corp.far{padding:0}.interior{padding:10px 13px 12px;display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}
.taburi{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:48px;border-top:1px solid var(--line)}
.taburi span{display:grid;place-items:center;font-size:10px;color:var(--soft);text-align:center}
.taburi span.on{color:var(--accent2);font-weight:600}
h3{font-size:25px;line-height:1.08}
.foto{width:100%;height:170px;object-fit:cover;display:block;flex:none}
.mic{font-size:12px;line-height:1.35;color:var(--soft)}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:7px;min-width:0}
.r{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.tit{font-weight:600}
.st{font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--soft)}.st.v{color:var(--ok)}.st.a{color:var(--warn)}
.btn{flex:none;width:100%;min-height:42px;padding:0 12px;border-radius:99px;background:var(--accent);color:var(--on);font-weight:600;font-size:14px}
.btn.al{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.mic2{width:auto;min-height:34px;font-size:12.5px}
.tinta{position:relative;animation:puls 1.5s ease-out infinite}
@keyframes puls{0%{box-shadow:0 0 0 0 rgba(226,200,143,.75)}75%,100%{box-shadow:0 0 0 12px rgba(226,200,143,0)}}
.camp{display:grid;gap:3px}
.camp small{font-size:11px;color:var(--soft)}
.camp div{min-height:35px;display:flex;align-items:center;padding:0 10px;background:var(--surface2);border:1px solid var(--line);border-radius:7px}
.doi{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.bif{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;line-height:1.35}
.bif i{width:18px;height:18px;border-radius:5px;background:var(--accent);color:var(--on);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.luna{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px}
.luna i{font-style:normal;color:var(--soft);font-size:10.5px}
.luna u{text-decoration:none;min-height:30px;display:grid;place-items:center;border-radius:5px;background:var(--surface2)}
.luna u.x{background:none;color:#677266;text-decoration:line-through}
.luna u.s{background:var(--accent);color:var(--on);font-weight:700}.luna u.b{background:rgba(200,164,93,.3)}
.scor{display:grid;place-items:center;width:42px;height:42px;border-radius:9px;background:var(--accent);color:var(--on);font-weight:700;flex:none}
.pov{border:1px solid var(--accent);border-radius:9px;padding:9px;font-family:var(--titlu);font-size:15.5px;line-height:1.25}
.prod{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.gata{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:rgba(138,211,166,.14);color:var(--ok);font-size:28px;align-self:center;flex:none}
.cod{font-size:20px;font-weight:700;letter-spacing:.14em;color:var(--accent2);text-align:center;font-variant-numeric:tabular-nums}
.bula{max-width:84%;padding:8px 11px;border-radius:12px;background:var(--surface2);align-self:flex-start}
.bula.eu{align-self:flex-end;background:var(--accent);color:var(--on)}
.scrie{margin-top:auto;display:flex;gap:6px;flex:none;align-items:center}
.scrie span{flex:1;min-width:0;min-height:40px;display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-radius:99px}
.scrie .btn{width:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kpis>*{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px;text-align:left;display:block}
.kpis b{display:block;font-family:var(--titlu);font-size:25px;font-weight:600;line-height:1.1}
.kpis span{font-size:11.5px;color:var(--soft)}
.apel{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.apel span{min-height:37px;display:grid;place-items:center;border-radius:8px;background:var(--surface2);font-size:12px;font-weight:600;text-align:center;padding:2px 5px}
.fir{height:7px;border-radius:9px;background:var(--surface2);overflow:hidden}.fir i{display:block;height:100%;background:var(--accent)}
.pozeg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.pozeg img{width:100%;height:62px;object-fit:cover;border-radius:6px;display:block}
/* Cardul real de membru */
.card-m{flex:none;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1.586;width:100%;padding:13px 14px;border:1px solid rgba(200,164,93,.7);border-radius:14px;color:#F4EBD8;background:radial-gradient(120% 130% at 90% 0%,#2C4634 0%,#17231A 55%,#0E1610 100%);animation:card .55s cubic-bezier(.2,.8,.2,1) both}
.card-m.silver{background:radial-gradient(120% 130% at 90% 0%,#4a4d50 0%,#1c1f20 55%,#101213 100%)}
.card-m.gold{background:radial-gradient(120% 130% at 90% 0%,#6b5120 0%,#2a2112 52%,#14100a 100%)}
@keyframes card{from{opacity:0;transform:rotateX(38deg) translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.card-m .sus{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#D9BC80}
.card-m b.niv{font-family:var(--titlu);font-size:32px;font-weight:500;line-height:1;color:#fff}
.card-m .jos{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:13px;font-weight:600}
.card-m small{display:block;font-size:10.5px;font-weight:400;color:#C9BCA3}
/* Ecran blocat cu notificare */
.blocat{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:34px 11px 18px;color:#fff;overflow:hidden}
.blocat>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.52)}
.blocat>*:not(img){position:relative}
.ora{font-size:62px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.data{font-size:15px;margin-bottom:26px}
.notif{width:100%;display:grid;grid-template-columns:36px 1fr;gap:10px;text-align:left;padding:11px;border-radius:17px;background:rgba(236,235,226,.9);color:#16170F;animation:notif .5s cubic-bezier(.2,1.1,.3,1) both .25s}
.notif .ic{width:36px;height:36px;border-radius:9px;background:#141B15;color:var(--accent2);display:grid;place-items:center;font-family:var(--titlu);font-size:15px;font-weight:600}
.notif b{display:block;font-size:13.5px;line-height:1.25}.notif span{font-size:12.5px;line-height:1.3;display:block}.notif small{font-size:10.5px;color:#55564C}
.notif.tinta{animation:notif .5s cubic-bezier(.2,1.1,.3,1) both .25s,puls 1.5s ease-out infinite .8s}
@keyframes notif{from{opacity:0;transform:translateY(-32px) scale(.96)}to{opacity:1;transform:none}}
.apasa{margin-top:auto;font-size:12.5px;color:#E8E6DA}
/* Copertă */
.coperta{position:relative;display:grid;grid-template-columns:minmax(0,1fr);align-content:end;gap:12px;min-height:min(72dvh,570px);border-radius:16px;overflow:hidden;padding:clamp(16px,4vw,38px)}
.coperta .poza-cop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.credit-tel{display:none}
@media (max-width:859px){.credit-tel{display:inline}}
.coperta::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,17,13,.1) 12%,rgba(12,17,13,.92) 70%)}
.coperta>*:not(picture){position:relative;z-index:1}
.coperta h1{font-size:clamp(46px,8.5vw,84px);line-height:.98}
.coperta p{font-size:clamp(16px,1.8vw,20px);line-height:1.4;max-width:54ch}
.alege{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px;max-width:960px}
.alege button{min-height:92px;padding:14px;text-align:left;background:rgba(20,27,21,.93);border:1px solid var(--line);border-radius:12px;display:grid;gap:4px;align-content:center}
.alege button:first-child{background:var(--accent);color:var(--on);border-color:var(--accent)}
.alege button:first-child span{color:#3C2F15}
.alege b{font-size:18px}.alege span{font-size:13.5px;line-height:1.3;color:var(--soft)}
.nota{font-size:12.5px;color:var(--soft);line-height:1.4}
.nota a{color:var(--accent2)}
/* Jos */
.jos-p{display:flex;align-items:center;gap:9px;padding:9px max(14px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 9px) max(14px,env(safe-area-inset-left));border-top:1px solid var(--line);background:var(--ground)}
.jos-p button{flex:none;min-height:46px;padding:0 17px;border-radius:10px;font-weight:600;font-size:15px}
#inapoi{border:1px solid var(--line)}
#inainte{background:var(--accent);color:var(--on)}
#pozitie{flex:1;min-width:0;text-align:center;font-size:13px;line-height:1.25;color:var(--soft)}
.jos-p button[disabled]{opacity:.38;cursor:default}
/* Panouri pentru Idee și Promovare, fără telefon */
.panou{display:grid;gap:10px;min-width:0;font-size:15px;line-height:1.35}
.panou .btn{margin-top:2px}
.panou .foto-p{width:100%;height:190px;object-fit:cover;border-radius:12px;display:block}
.bloc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.bloc b{font-size:16px}
.bloc small{font-size:13.5px;line-height:1.35;color:var(--soft)}
.bloc .zic{font-family:var(--titlu);font-size:19px;line-height:1.2;color:var(--accent2)}
.bloc.tare{border-color:var(--accent)}
.bloc.stins{opacity:.85;border-style:dashed}
.coperta p.nota{font-size:13px}
.doua{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eti{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.etape{display:grid;gap:8px}
.etapa{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.etapa.tare{border-color:var(--accent)}
.etapa.stins{opacity:.85;border-style:dashed}
.etapa>b{font-family:var(--titlu);font-size:19px;font-weight:600;line-height:1.1;color:var(--accent2)}
.etapa small{display:block;font-size:13.5px;line-height:1.35;color:var(--soft)}
.cerc{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch}
.cerc>span{display:grid;place-items:center;color:var(--accent);font-size:18px}
.cerc .bloc{text-align:center;align-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{padding:6px 11px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;background:var(--surface2)}
@media (max-width:859px){
  .coperta{padding-top:255px;background:var(--ground);border:1px solid var(--line)}
  .coperta .poza-cop{height:330px;bottom:auto;object-position:12% 50%}
  .coperta::after{bottom:auto;height:330px;background:linear-gradient(180deg,rgba(12,17,13,0) 62%,var(--ground) 100%)}
}
@media (max-width:480px){.doua{grid-template-columns:1fr}.etapa{grid-template-columns:1fr;gap:4px}}
@media (min-width:860px){
  .slide.cu-panou{grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:48px}
  .bloc small,.etapa small,.chips span{font-size:15px}
  .slide.cu-tel{grid-template-columns:minmax(0,1fr) 346px;gap:56px}
  .poveste{gap:15px}
  #scena{padding-top:20px}
}
@media (min-width:860px) and (max-height:790px){#scena{padding-top:12px;padding-bottom:12px}.tel{height:calc(100dvh - 148px);min-height:530px}}
@media (prefers-reduced-motion:reduce){.apare,.tinta,.card-m,.notif,.notif.tinta{animation:none}}
</style>
</head>
<body>
<div class="pagina">
  <nav class="meniu" id="meniu" aria-label="Parcursuri"></nav>
  <main id="scena" tabindex="-1"></main>
  <footer class="jos-p">
    <button id="inapoi" data-a="inapoi">‹ Înapoi</button>
    <span id="pozitie" aria-live="polite"></span>
    <button id="inainte" data-a="next">Înainte ›</button>
  </footer>
</div>
<script>
'use strict';
const P='poze/';
const CL=['Acasă','Apartamente','Bistro','Abonamente','Cont'], PN=['Acasă','Rezervări','Mesaje','Mai mult'];
const tel=(titlu,dr,corp,tab,on,far)=>`<div class="tel" role="group" aria-label="Ecran din aplicație: ${titlu}"><div class="bara"><span>${titlu}</span><small>${dr||''}</small></div><div class="corp ${far?'far':''} apare">${corp}</div><div class="taburi">${(tab||[]).map(t=>`<span class="${t===on?'on':''}">${t}</span>`).join('')}</div></div>`;
const blocat=(titlu,text,cand)=>`<div class="tel" role="group" aria-label="Telefon blocat, cu notificare"><div class="blocat"><img src="${P}munte.jpg" alt=""><div class="ora">18:42</div><div class="data">sâmbătă, 7 noiembrie</div><button class="notif tinta" data-a="next"><span class="ic">GF</span><span><small>Green Future · ${cand||'acum'}</small><b>${titlu}</b><span>${text}</span></span></button><div class="apasa">Apasă pe notificare</div></div></div>`;
const buton=(t,x)=>`<button class="btn tinta ${x||''}" data-a="next">${t}</button>`;
const camp=(e,v)=>`<div class="camp"><small>${e}</small><div>${v}</div></div>`;
const cardM=(cls,niv)=>`<section class="card-m ${cls}" aria-label="Cardul de membru"><div class="sus">Green Future Club</div><b class="niv">${niv}</b><div class="jos"><div>Ana Marinescu<small>Membru din 2026</small></div><div style="text-align:right"><small>Număr card</small>GF-000128</div></div></section>`;
const calendar=()=>{let c='';['L','M','M','J','V','S','D'].forEach(x=>c+=`<i>${x}</i>`);for(let i=2;i<=29;i++)c+=`<u class="${i<7||i===10||i===11?'x':i===14||i===16?'s':i===15?'b':''}">${i}</u>`;return `<div class="luna">${c}</div>`};

const panou=(corp,b)=>`<div class="panou apare">${corp}${buton(b||'Mai departe')}</div>`;
const etapa=(n,t,x,c)=>`<div class="etapa ${c||''}"><b>${n}</b><div><div class="tit">${t}</div><small>${x}</small></div></div>`;
const bloc=(t,x,c)=>`<div class="bloc ${c||''}"><b>${t}</b><small>${x}</small></div>`;

const F=[
 {id:'idee',cine:'idee',nume:'De unde a pornit',pasi:[
  {w:1,t:'Oamenii nu mai caută doar un loc de dormit',p:'Vor să le fie bine în fiecare moment al sejurului. De aici a pornit aplicația: de la ce simte clientul, nu de la tehnologie.',e:()=>panou(`<img class="foto-p" src="${P}piscina.jpg" alt="Piscina complexului"><div class="doua"><div class="bloc stins"><span class="eti">Cazare obișnuită</span><small>Iei cheia, dormi, pleci.</small></div><div class="bloc tare"><span class="eti">Ce își doresc azi</span><small>Cineva la care să apeleze, micul dejun comandat din telefon, spa la câțiva pași și un motiv să revină.</small></div></div>`)},
  {w:1,t:'De obicei, legătura se termină la plecare',p:'Clientul pleacă, iar proprietarul nu mai are cum să-i spună că îl așteaptă. Data viitoare, omul o ia de la capăt cu o nouă căutare.',e:()=>panou(`<div class="etape">${etapa('Înainte','Caută și rezervă','Găsește locul printre multe altele.')}${etapa('În timpul sejurului','Stă și se bucură','Dacă are nevoie de ceva, caută un număr de telefon.')}${etapa('După','Legătura se oprește','Niciun mesaj, niciun motiv să revină la același loc.','stins')}</div>`)},
  {w:1,t:'Aplicația însoțește clientul tot drumul',p:'Tot sejurul stă într-un singur loc, în telefonul lui. Nu mai caută numere de telefon și nu mai sare de la un site la altul.',e:()=>panou(`<div class="etape">${etapa('Înainte','Rezervă direct','Vede zilele libere, prețul exact și povestea locului.','tare')}${etapa('În timpul sejurului','Are totul la îndemână','Comandă de la bistro și îi scrie gazdei direct din aplicație.','tare')}${etapa('După','Rămâne aproape','Spune cum i-a fost, primește cardul de membru și oferte pe telefon.','tare')}</div>`)},

  {t:'Asta e aplicația',p:'Clientul trăiește o experiență plăcută și rămâne aproape. Proprietarul gestionează totul de pe telefon și primește rezervări directe, fără comision de intermediar.',o:'Încă în lucru: plata cu cardul, comenzile reale la bistro și publicarea în App Store și Google Play.',e:()=>tel('Green Future','Sinaia',`<img class="foto" src="${P}piscina.jpg" alt="Piscina complexului" style="height:230px"><div class="interior"><h3>Mulțumim!</h3><div class="mic">greenfuturesinaia.com</div><button class="btn tinta" data-a="start">Reia prezentarea</button></div>`,CL,'Acasă',1)}

];
const LIN=[];F.forEach((f,fi)=>f.pasi.forEach((p,pi)=>LIN.push({f,fi,p,pi,id:`${f.id}-${pi+1}`})));
let poz=-1;
const $=id=>document.getElementById(id);
function meniu(){
  const fa=poz>=0?LIN[poz].f.id:null;
  const b=f=>`<button data-a="flux" data-v="${f.id}" aria-current="${f.id===fa}">${f.nume}</button>`;
  const g=(et,c)=>`<span class="gr">${et}</span>${F.filter(f=>f.cine===c).map(b).join('')}`;
  $('meniu').innerHTML=`<button data-a="start" aria-current="${poz<0}">Început</button>${g('Ideea','idee')}${g('Client','client')}${g('Proprietar','gest')}${g('Promovare','promo')}`;
  const c=document.querySelector('#meniu [aria-current=true]');if(c)c.scrollIntoView({block:'nearest',inline:'center'});
}
function arata(n,faraHash){
  poz=Math.max(-1,Math.min(LIN.length-1,n));meniu();
  const sc=$('scena');
  if(poz<0){
    sc.innerHTML=`<div class="slide"><section class="coperta"><picture><source media="(max-width:859px)" srcset="${P}peles.jpg"><img class="poza-cop" src="${P}fatada.jpg" alt="Green Future Sinaia"></picture><div class="eticheta">Prezentarea aplicației</div><h1>Green Future Sinaia</h1><p>O experiență mai frumoasă pentru oaspeți și o legătură care rămâne caldă și după plecare. Apasă pe butonul care pulsează.</p><div class="alege"><button data-a="flux" data-v="idee"><b>De unde a pornit ideea</b><span>Ce își doresc azi clienții și ce le oferim</span></button><button data-a="flux" data-v="rezervare"><b>Ca un client</b><span>Rezervare, comandă, card de membru, notificare</span></button><button data-a="flux" data-v="intrare"><b>Ca un proprietar</b><span>Intrare în cont, confirmări, mesaje, prețuri</span></button><button data-a="flux" data-v="promovare"><b>Cum vom promova</b><span>Google, Google Maps, ChatGPT și recomandări</span></button></div><p class="nota">Ecrane refăcute după aplicație, cu datele unui oaspete de exemplu. Pozele sunt reale.<span class="credit-tel"> Foto Castelul Peleș: <a href="https://commons.wikimedia.org/wiki/File:Castelul_Peles_in_culori_de_toamna.jpg" rel="noopener">Magda Constantin, Wikimedia Commons</a>, CC BY-SA 3.0 RO.</span></p></section></div>`;
    $('pozitie').textContent='Început';
  }else{
    const x=LIN[poz],np=x.f.pasi.length;
    const et={idee:'Ideea',client:'Ca un client',gest:'Ca un proprietar',promo:'Promovare'}[x.f.cine];
    sc.innerHTML=`<div class="slide ${x.p.w?'cu-panou':'cu-tel'}"><section class="poveste"><div class="eticheta">${et} · ${x.f.nume}</div><div class="pasi" aria-hidden="true">${x.f.pasi.map((_,k)=>`<i class="${k<=x.pi?'g':''}"></i>`).join('')}</div><h2>${x.p.t}</h2><p>${x.p.p}</p>${x.p.s?`<div class="spate"><b>În spate</b>${x.p.s}</div>`:''}${x.p.o?`<div class="obs">${x.p.o}</div>`:''}</section>${x.p.e()}</div>`;
    $('pozitie').textContent=`${x.f.nume}, pasul ${x.pi+1} din ${np}`;
  }
  sc.scrollTop=0;
  $('inapoi').disabled=poz<0;$('inainte').disabled=poz===LIN.length-1;
  if(!faraHash)try{history.replaceState(null,'','#'+(poz<0?'start':LIN[poz].id))}catch(e){}
  if(poz>=0&&innerWidth<860){const t=sc.querySelector('.tel');if(t&&t.getBoundingClientRect().top>sc.clientHeight*.62)sc.scrollTop=t.offsetTop-sc.offsetTop-8}
}
const ACT={next(){arata(poz+1)},inapoi(){arata(poz-1)},start(){arata(-1)},flux(v){arata(LIN.findIndex(x=>x.f.id===v))}};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;ACT[b.dataset.a](b.dataset.v)});
document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight'||ev.key==='PageDown')arata(poz+1);if(ev.key==='ArrowLeft'||ev.key==='PageUp')arata(poz-1)});
window.addEventListener('hashchange',()=>{const n=LIN.findIndex(x=>'#'+x.id===location.hash);if(n>=0&&n!==poz)arata(n,true)});
arata(LIN.findIndex(x=>'#'+x.id===location.hash),true);
</script>
